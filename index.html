<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskCube · 3D 큐브 업무 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ SVG icon defs ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.5" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="21 4 21 9 16 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="3" y1="9" x2="21" y2="9" stroke="currentColor" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-bars" viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8" rx="1" fill="currentColor"/><rect x="10" y="8" width="4" height="13" rx="1" fill="currentColor"/><rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
      <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="3 3 3 8 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 7l9 5 9-5M12 12v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4" stroke="currentColor" stroke-width="2"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="7 10 12 15 17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><polyline points="7 8 12 3 17 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <!-- ============ Header ============ -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo"><svg class="icon"><use href="#i-cube"/></svg></div>
        <div class="brand-text">
          <div class="brand-name">TaskCube<span class="brand-dot">.</span></div>
          <div class="brand-sub">3D WORKSPACE · 입체 업무 보드</div>
        </div>
      </div>

      <!-- 대분류(Z축) 네비게이션 — 상단, 휠로 전환 -->
      <div class="group-nav" id="zNav" title="휠로 분류 전환">
        <button class="gnav-btn" id="zNavPrev" title="앞 대분류">◀</button>
        <div class="gnav-body">
          <span class="gnav-name" id="zNavName" title="더블클릭으로 이름 변경">대분류</span>
          <span class="gnav-idx" id="zNavIdx">1 / 1</span>
        </div>
        <button class="gnav-btn" id="zNavNext" title="뒤 대분류">▶</button>
        <button class="gnav-btn gnav-del" id="zNavDel" title="현재 대분류 삭제"><svg class="icon"><use href="#i-trash"/></svg></button>
      </div>

      <div class="hdr-spacer"></div>

      <div class="mode-toggle" id="modeToggle">
        <button class="mode-btn" data-mode="3d">입체</button>
        <button class="mode-btn" data-mode="flat">평면</button>
      </div>

      <div class="hdr-group">
        <button class="icon-btn" id="resetView" title="시점·위치 초기화"><svg class="icon"><use href="#i-reset"/></svg></button>
        <button class="icon-btn" id="themeToggle" title="테마 전환"><svg class="icon theme-icon-dark"><use href="#i-sun"/></svg><svg class="icon theme-icon-light"><use href="#i-moon"/></svg></button>
        <div class="menu-wrap">
          <button class="icon-btn" id="shareMenuBtn" title="공유 · 내보내기"><svg class="icon"><use href="#i-share"/></svg></button>
          <div class="menu" id="shareMenu" hidden>
            <button class="menu-item" id="mShareLink"><svg class="icon"><use href="#i-link"/></svg> 공유 링크 만들기</button>
            <div class="menu-sep"></div>
            <button class="menu-item" id="mExportCsv"><svg class="icon"><use href="#i-download"/></svg> CSV 내보내기</button>
            <button class="menu-item" id="mImportCsv"><svg class="icon"><use href="#i-upload"/></svg> CSV 가져오기</button>
          </div>
        </div>
      </div>

      <div class="hdr-group">
        <button class="add-stage-btn alt" id="zNavAdd"><svg class="icon"><use href="#i-plus"/></svg> 분류 추가</button>
        <button class="add-stage-btn alt" id="addStage"><svg class="icon"><use href="#i-plus"/></svg> 단계 추가</button>
      </div>

      <div class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input type="text" id="search" placeholder="카드 검색..." autocomplete="off" />
      </div>
    </header>

    <input type="file" id="csvFile" accept=".csv,text/csv" hidden />

    <!-- ============ 3D Board ============ -->
    <main class="stage" id="stage">
      <div class="scene" id="scene">
        <div class="board" id="board"><!-- columns injected here --></div>
        <div class="ad-floor" id="adFloor" aria-hidden="true"><!-- Phase 2: ad slots --></div>
      </div>

      <!-- 대분류 목차 — 보드 영역 안(헤더와 분리) -->
      <div class="group-reel" id="groupReel" title="휠로 분류 전환"></div>
    </main>

    <!-- 입체 모드 좌우·상하 스크롤(패닝) 바 -->
    <div class="pan-bar pan-bar-v" id="panBarV" title="상하 이동"><div class="pan-grip" id="panGripV"></div></div>
    <div class="pan-bar pan-bar-h" id="panBarH" title="좌우 이동"><div class="pan-grip" id="panGripH"></div></div>

    <!-- 시점 + 축 gizmo — 하단 우측, 세로 중앙 정렬 -->
    <div class="vp-group">
      <div class="axis-gizmo" aria-hidden="true">
        <div class="axis-inner" id="axisInner">
          <div class="ax ax-x"></div>
          <div class="ax ax-y"></div>
          <div class="ax ax-z"></div>
          <span class="ax-cap" id="capX">단계</span>
          <span class="ax-cap" id="capY">리스트</span>
          <span class="ax-cap" id="capZ">분류</span>
          <div class="ax-origin"></div>
        </div>
      </div>
      <div class="viewpoint" id="viewpoint">
        <span class="vp-label">시점</span>
        <div class="vp-rows">
          <label class="vp-row"><span>X</span><input type="range" id="rotX" min="-60" max="60" step="1" /></label>
          <label class="vp-row"><span>Y</span><input type="range" id="rotY" min="-60" max="60" step="1" /></label>
        </div>
      </div>
    </div>

    <!-- ============ Hint bar ============ -->
    <footer class="hint-bar">
      <div class="hint"><span>카드 <b>드래그</b>로</span><span>이동</span></div>
      <div class="hint"><span><b class="hl">◀ ▶</b>로 대분류</span><span>전환</span></div>
      <div class="hint"><span>빈 공간 <b>드래그</b></span><span>시점 회전</span></div>
      <div class="hint"><span><b class="hl">휠</b>로</span><span>줌 인 · 아웃</span></div>
      <div class="hint"><span>빈 공간 <b class="hl">더블클릭</b></span><span>시점 복귀</span></div>
    </footer>
  </div>

  <!-- ============ Card editor modal ============ -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">카드 편집</h2>
        <button class="icon-btn" id="modalClose"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <form id="cardForm" class="modal-body">
        <label class="field"><span>제목</span><input type="text" id="f-title" required maxlength="80" /></label>
        <label class="field"><span>범주 <small>(쉼표로 구분 · Z축 깊이)</small></span><input type="text" id="f-categories" placeholder="디자인, 개발" /></label>
        <div class="chip-picker" id="catSuggest"></div>
        <div class="field-row">
          <label class="field"><span>마감일</span><input type="date" id="f-due" /></label>
          <label class="field"><span>담당자</span><input type="text" id="f-assignee" maxlength="6" placeholder="이니셜" /></label>
        </div>
        <label class="field"><span>우선순위</span>
          <select id="f-priority"><option value="높음">높음</option><option value="보통" selected>보통</option><option value="낮음">낮음</option></select>
        </label>
        <label class="field"><span>메모 <small>(카드 뒷면)</small></span><textarea id="f-note" rows="3" maxlength="400"></textarea></label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="modalCancel">취소</button>
          <button type="submit" class="btn primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ Share modal ============ -->
  <div class="modal-overlay" id="shareOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="shareModalTitle">공유 링크</h2>
        <button class="icon-btn" id="shareClose"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body">
        <p class="share-desc" id="shareDesc">아래 링크를 친구에게 보내세요. 친구가 링크를 열면 이 보드가 자신의 보드에 병합됩니다.</p>
        <label class="field"><span>공유 링크</span><textarea id="shareUrl" rows="3" readonly></textarea></label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="shareCopyCode">코드만 복사</button>
          <button type="button" class="btn primary" id="shareCopy"><svg class="icon"><use href="#i-copy"/></svg> 링크 복사</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js" defer></script>
</body>
</html>

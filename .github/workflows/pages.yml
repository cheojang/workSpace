name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/task-dashboard-drag-drop-XjKwS"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/task-dashboard-drag-drop-XjKwS

      # 배포마다 에셋 URL에 커밋 해시를 붙여 브라우저 캐시를 무효화
      - name: Cache-bust asset URLs
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/href=\"styles.css\"/href=\"styles.css?v=$V\"/" index.html
          sed -i "s/src=\"app.js\"/src=\"app.js?v=$V\"/" index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - uses: actions/deploy-pages@v4
        id: deployment
